<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2025聖誕餐會 設備外借管理系統</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); position: relative; }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 30px; }
        .home-menu { display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .btn-main { width: 100%; max-width: 280px; padding: 18px; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.3s; text-align: center; }
        .btn-borrow { background-color: #3498db; color: white; }
        .btn-return { background-color: #e67e22; color: white; }
        .form-section, .admin-section { display: none; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; font-size: 14px; }
        input[type="text"], input[type="date"], input[type="time"], input[type="file"], input[type="password"], input[type="email"], select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        .hidden { display: none; }
        .radio-group { display: flex; gap: 15px; align-items: center; margin-top: 5px; }
        .radio-group label { display: flex; align-items: center; font-weight: normal; font-size: 16px; margin: 0; cursor: pointer; }
        .btn-submit { width: 100%; padding: 15px; background-color: #27ae60; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-back { width: 100%; padding: 12px; background-color: #95a5a6; color: white; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        hr { border: 0; border-top: 1px solid #eee; margin: 25px 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; white-space: nowrap; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 8px; max-width: 400px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .rules-link { color: #3498db; text-decoration: underline; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2 onclick="secretAdminTrigger()" style="user-select: none; cursor: pointer;">🎄 聖誕餐會設備管理系統</h2>

    <div id="homeMenu" class="home-menu">
        <button class="btn-main btn-borrow" onclick="showSection('borrowSection')">我要借設備</button>
        <button class="btn-main btn-return" onclick="showSection('returnSection')">我要歸還設備</button>
    </div>

    <div id="loginModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-top: 0; color: #34495e;">🔐 管理員身分驗證</h3>
            <div class="form-group"><label>管理員信箱</label><input type="email" id="adminEmail" placeholder="admin@christmas.com"></div>
            <div class="form-group"><label>密碼</label><input type="password" id="adminPassword"></div>
            <button class="btn-submit" onclick="adminLogin()">登入後台</button>
            <button class="btn-back" onclick="document.getElementById('loginModal').style.display='none'">取消</button>
        </div>
    </div>

    <div id="borrowSection" class="form-section">
        <h3 style="text-align: center; color: #3498db;">📝 填寫借用單</h3>
        <form id="borrowForm">
            <div class="form-group"><label>日期與星期</label><input type="date" id="borrowDate" required></div>
            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex: 1;"><label>借用時間</label><input type="time" id="startTime" step="3600" onchange="snapTime(this)" required></div>
                <div class="form-group" style="flex: 1;"><label>歸還時間</label><input type="time" id="endTime" step="3600" onchange="snapTime(this)" required></div>
            </div>
            <div class="form-group"><label>小組負責人 (姓名 / 電話)</label><input type="text" id="leaderInfo" placeholder="例：王大明 0912345678" required></div>
            <div class="form-group">
                <label>借用場地</label>
                <select id="location" onchange="checkRules()" required>
                    <option value="">請選擇場地...</option>
                    <option value="交誼廳">交誼廳</option>
                    <option value="餐廳">餐廳</option>
                    <option value="兒主">兒主</option>
                    <option value="幼主">幼主</option>
                    <option value="教會外場地">教會外場地</option>
                </select>
            </div>
            
            <div class="form-group hidden" id="soundTechSection">
                <label style="color: #e74c3c;">是否需要音控同工協助開啟設備？</label>
                <div class="radio-group">
                    <label><input type="radio" name="needTech" value="是"> 是</label>
                    <label><input type="radio" name="needTech" value="否" checked> 否</label>
                </div>
            </div>

            <hr>
            <h4 style="color: #333;">設備需求</h4>
            <div class="form-group"><label>MA303 (總量：3)</label><select id="ma303"><option value="0">不需要</option><option value="1">1 台</option><option value="2">2 台</option><option value="3">3 台</option></select></div>
            <div class="form-group"><label>MA707 (總量：1)</label><select id="ma707"><option value="0">不需要</option><option value="1">1 台</option></select></div>
            <div class="form-group"><label>譜架 (總量：6，最多借2個)</label><select id="musicStand"><option value="0">不需要</option><option value="1">1 個</option><option value="2">2 個</option></select></div>
            <div class="form-group" id="pianoSection"><label>鋼琴 (教會外場地禁止借用)</label><label style="font-weight: normal; font-size: 16px;"><input type="checkbox" id="piano" style="width: 18px; height: 18px; margin-right: 8px; cursor: pointer;"> 需要借用鋼琴</label></div>
            <div class="form-group"><label>其他 (備註)</label><input type="text" id="notes" placeholder="無"></div>

            <div class="form-group" style="background: #f8f9fa; padding: 15px; border-radius: 6px; margin-top: 20px;">
                <label style="font-weight: normal; color: #d9534f; font-size: 15px; display: flex; align-items: center; gap: 8px;">
                    <input type="checkbox" id="agreeRules" required> 
                    我已閱讀並同意 <span class="rules-link" onclick="openModal()">設備借用守則</span>
                </label>
            </div>

            <button type="button" class="btn-submit" id="submitBorrowBtn" onclick="submitBorrow()">送出借用申請</button>
            <button type="button" class="btn-back" onclick="showSection('homeMenu')">返回首頁</button>
        </form>
    </div>

    <div id="returnSection" class="form-section">
        <h3 style="text-align: center; color: #e67e22;">🔄 填寫歸還單</h3>
        <form id="returnForm">
            <div class="form-group"><label>歸還日期</label><input type="date" id="returnDate" required></div>
            <div class="form-group"><label>小組負責人 (姓名)</label><input type="text" id="returnLeaderName" placeholder="例：王大明" required></div>
            <div class="form-group"><label>聯絡電話</label><input type="text" id="returnLeaderPhone" placeholder="例：0912345678" required></div>
            <div class="form-group"><label>歸還設備照片上傳</label><input type="file" id="returnPhoto" accept="image/*" required></div>
            <div class="form-group"><label>歸還狀態 (如有損壞請註明)</label><input type="text" id="returnNotes" placeholder="設備皆正常歸還"></div>
            
            <button type="button" class="btn-submit" id="submitReturnBtn" onclick="submitReturn()">送出歸還通知</button>
            <button type="button" class="btn-back" onclick="showSection('homeMenu')">返回首頁</button>
        </form>
    </div>

    <div id="adminSection" class="admin-section">
        <h3 style="color: #34495e; text-align: center;">📊 設備借還後台管理</h3>
        <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
            <button class="btn-back" style="width: 48%; margin:0;" onclick="loadAdminData()">🔄 重新整理資料</button>
            <button class="btn-back" style="width: 48%; margin:0; background-color: #c0392b;" onclick="adminLogout()">登出管理員</button>
        </div>
        
        <h4>📦 借用紀錄清單</h4>
        <div style="overflow-x: auto; padding-bottom: 10px;">
            <table id="borrowTable">
                <tr><th>日期</th><th>時間</th><th>場地</th><th>負責人</th><th>MA303</th><th>MA707</th><th>譜架</th><th>鋼琴</th><th>備註</th></tr>
            </table>
        </div>

        <h4 style="margin-top: 25px;">🔄 歸還紀錄清單</h4>
        <div style="overflow-x: auto;">
            <table id="returnTable">
                <tr><th>日期</th><th>負責人</th><th>電話</th><th>照片</th></tr>
            </table>
        </div>

        <button class="btn-back" style="margin-top: 25px;" onclick="showSection('homeMenu')">返回首頁</button>
    </div>
</div>

<div id="rulesModal" class="modal">
    <div class="modal-content">
        <h3 style="margin-top: 0;">設備借用守則</h3>
        <p>1. 請務必於申請時段內歸還設備。</p>
        <p>2. 歸還時請將設備恢復原狀，並拍攝照片上傳至歸還系統。</p>
        <p>3. 若有設備損壞，請主動於歸還備註中說明。</p>
        <button class="btn-submit" onclick="closeModal()">我瞭解了</button>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://xziokuyieegbuznwrnjp.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_fg9cjYZrdkzZ8oiE6yH_Kg_Qcppb6pg';
    
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function showSection(sectionId) {
        document.getElementById('homeMenu').style.display = 'none';
        document.getElementById('borrowSection').style.display = 'none';
        document.getElementById('returnSection').style.display = 'none';
        document.getElementById('adminSection').style.display = 'none';
        
        if (sectionId === 'homeMenu') document.getElementById('homeMenu').style.display = 'flex';
        else document.getElementById(sectionId).style.display = 'block';
    }

    function openModal() { document.getElementById('rulesModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('rulesModal').style.display = 'none'; }

    function checkRules() {
        var loc = document.getElementById("location").value;
        var pianoSec = document.getElementById("pianoSection");
        var techSec = document.getElementById("soundTechSection");
        if (loc === "教會外場地") { pianoSec.classList.add("hidden"); document.getElementById("piano").checked = false; } else { pianoSec.classList.remove("hidden"); }
        if (loc === "兒主" || loc === "幼主") { techSec.classList.remove("hidden"); } else { techSec.classList.add("hidden"); }
    }

    function snapTime(input) {
        if (!input.value) return;
        var parts = input.value.split(':');
        var hours = parseInt(parts[0], 10);
        var mins = parseInt(parts[1], 10);
        if (mins !== 0) {
            if (mins >= 30) hours += 1;
            if (hours >= 24) hours = 0;
            input.value = hours.toString().padStart(2, '0') + ':00';
            alert("系統已將時間自動調整為整點！");
        }
    }

    async function checkAdminAccess() {
        const { data: { session } } = await db.auth.getSession();
        if (session) {
            showSection('adminSection');
            loadAdminData();
        } else {
            document.getElementById('loginModal').style.display = 'flex';
        }
    }

    async function adminLogin() {
        var email = document.getElementById('adminEmail').value;
        var password = document.getElementById('adminPassword').value;

        const { data, error } = await db.auth.signInWithPassword({ email: email, password: password });
        if (error) {
            alert("登入失敗：" + error.message);
        } else {
            document.getElementById('loginModal').style.display = 'none';
            alert("管理員登入成功！");
            showSection('adminSection');
            loadAdminData();
        }
    }

    async function adminLogout() {
        await db.auth.signOut();
        alert("已登出管理員");
        showSection('homeMenu');
    }

    async function loadAdminData() {
        const { data: borrowData, error: borrowError } = await db.from('borrow_records').select('*').order('id', { ascending: false });
        if (!borrowError) {
            var bHtml = '<tr><th>日期</th><th>時間</th><th>場地</th><th>負責人</th><th>MA303</th><th>MA707</th><th>譜架</th><th>鋼琴</th><th>備註</th></tr>';
            borrowData.forEach(item => {
                let vMa303 = (item.ma303 === "0" || !item.ma303) ? "-" : item.ma303;
                let vMa707 = (item.ma707 === "0" || !item.ma707) ? "-" : item.ma707;
                let vStand = (item.music_stand === "0" || !item.music_stand) ? "-" : item.music_stand;
                let vPiano = (item.piano === "無" || !item.piano) ? "-" : item.piano;
                let vNotes = (item.notes) ? item.notes : "-";

                bHtml += `<tr>
                    <td>${item.borrow_date}</td><td>${item.start_time}-${item.end_time}</td>
                    <td>${item.location}</td><td>${item.leader_info}</td>
                    <td style="text-align:center;">${vMa303}</td><td style="text-align:center;">${vMa707}</td>
                    <td style="text-align:center;">${vStand}</td><td style="text-align:center;">${vPiano}</td>
                    <td>${vNotes}</td>
                </tr>`;
            });
            document.getElementById('borrowTable').innerHTML = bHtml;
        }

        const { data: returnData, error: returnError } = await db.from('return_records').select('*').order('id', { ascending: false });
        if (!returnError) {
            var rHtml = '<tr><th>日期</th><th>負責人</th><th>電話</th><th>照片</th></tr>';
            returnData.forEach(item => {
                rHtml += `<tr><td>${item.return_date}</td><td>${item.leader_name}</td><td>${item.leader_phone}</td><td><a href="${item.photo_url}" target="_blank">檢視照片</a></td></tr>`;
            });
            document.getElementById('returnTable').innerHTML = rHtml;
        }
    }

    // 🔥 升級版：包含場地與設備重疊防呆機制的送出函式
    async function submitBorrow() {
        if (!document.getElementById("agreeRules").checked) { alert("請勾選同意借用守則！"); return; }
        
        var date = document.getElementById("borrowDate").value;
        var startTime = document.getElementById("startTime").value;
        var endTime = document.getElementById("endTime").value;
        var loc = document.getElementById("location").value;
        var leader = document.getElementById("leaderInfo").value;

        if (!date || !startTime || !endTime || !leader || !loc) {
            alert("請填寫所有必填欄位！"); return;
        }

        // 將時間轉換成整數小時 (例如 18:00 變成 18)
        var startHour = parseInt(startTime.split(':')[0], 10);
        var endHour = parseInt(endTime.split(':')[0], 10);
        
        if (startHour >= endHour) {
            alert("歸還時間必須晚於借用時間！"); return;
        }

        var reqMa303 = parseInt(document.getElementById("ma303").value) || 0;
        var reqMa707 = parseInt(document.getElementById("ma707").value) || 0;
        var reqStand = parseInt(document.getElementById("musicStand").value) || 0;
        var reqPiano = document.getElementById("piano").checked;

        var btn = document.getElementById("submitBorrowBtn");
        btn.disabled = true; btn.innerText = "檢查時段與設備狀態中...";

        // 1. 抓取同一天的所有借用紀錄進行比對
        const { data: records, error: fetchError } = await db
            .from('borrow_records')
            .select('*')
            .eq('borrow_date', date);

        if (fetchError) {
            alert("資料庫連線失敗：" + fetchError.message);
            btn.disabled = false; btn.innerText = "送出借用申請";
            return;
        }

        // 2. 逐小時比對衝突 (防呆機制核心邏輯)
        for (let h = startHour; h < endHour; h++) {
            let usedMa303 = 0, usedMa707 = 0, usedStand = 0, usedPiano = false;

            for (let record of records) {
                let recStart = parseInt(record.start_time.split(':')[0], 10);
                let recEnd = parseInt(record.end_time.split(':')[0], 10);

                // 若該紀錄的時間範圍涵蓋了當下檢查的小時區間 (交接點不衝突)
                if (recStart <= h && recEnd > h) {
                    // 檢查場地衝突
                    if (record.location === loc) {
                        alert(`⛔ 【場地衝突】\n\n${h}:00-${h+1}:00 時段的「${loc}」已被其他人借用！\n請修改時間或選擇其他場地。`);
                        btn.disabled = false; btn.innerText = "送出借用申請";
                        return;
                    }
                    
                    // 累加該小時段被借出的設備總量
                    usedMa303 += parseInt(record.ma303) || 0;
                    usedMa707 += parseInt(record.ma707) || 0;
                    usedStand += parseInt(record.music_stand) || 0;
                    if (record.piano === "是") usedPiano = true;
                }
            }

            // 檢查設備庫存是否足夠
            if (reqMa303 > 0 && (reqMa303 + usedMa303 > 3)) {
                alert(`⛔ 【設備不足】\n\n${h}:00-${h+1}:00 時段的 MA303 僅剩 ${3 - usedMa303} 台\n您預計借用 ${reqMa303} 台，請修改數量！`);
                btn.disabled = false; btn.innerText = "送出借用申請";
                return;
            }
            if (reqMa707 > 0 && (reqMa707 + usedMa707 > 1)) {
                alert(`⛔ 【設備不足】\n\n${h}:00-${h+1}:00 時段的 MA707 已被借出！`);
                btn.disabled = false; btn.innerText = "送出借用申請";
                return;
            }
            if (reqStand > 0 && (reqStand + usedStand > 6)) {
                alert(`⛔ 【設備不足】\n\n${h}:00-${h+1}:00 時段的 譜架 僅剩 ${6 - usedStand} 個！`);
                btn.disabled = false; btn.innerText = "送出借用申請";
                return;
            }
            if (reqPiano && usedPiano) {
                alert(`⛔ 【設備不足】\n\n${h}:00-${h+1}:00 時段的 鋼琴 已被借出！`);
                btn.disabled = false; btn.innerText = "送出借用申請";
                return;
            }
        }

        // 3. 通過防呆測試，準備寫入資料
        btn.innerText = "資料秒速傳送中...";
        var techOption = "否";
        if (loc === "兒主" || loc === "幼主") {
            techOption = document.querySelector('input[name="needTech"]:checked').value;
        }

        const { error } = await db.from('borrow_records').insert([{
            borrow_date: date,
            start_time: startTime,
            end_time: endTime,
            location: loc,
            leader_info: leader,
            need_tech: techOption,
            ma303: reqMa303.toString(),
            ma707: reqMa707.toString(),
            piano: reqPiano ? "是" : "無",
            music_stand: reqStand.toString(),
            notes: document.getElementById("notes").value
        }]);

        if (error) { alert("發生錯誤：" + error.message); } 
        else {
            alert("借用申請已成功送出！");
            document.getElementById("borrowForm").reset();
            checkRules(); showSection('homeMenu');
        }
        btn.disabled = false; btn.innerText = "送出借用申請";
    }

    async function submitReturn() {
        var date = document.getElementById("returnDate").value;
        var name = document.getElementById("returnLeaderName").value;
        var phone = document.getElementById("returnLeaderPhone").value;
        var fileInput = document.getElementById("returnPhoto");
        
        if(!date || !name || !phone || fileInput.files.length === 0) { alert("請填寫所有欄位並上傳照片！"); return; }

        var btn = document.getElementById("submitReturnBtn");
        btn.disabled = true; btn.innerText = "照片上傳中...";

        var file = fileInput.files[0];
        var fileName = Date.now() + "_" + name + "_" + file.name; 

        const { data: uploadData, error: uploadError } = await db.storage
            .from('return_photos')
            .upload(fileName, file);

        if (uploadError) {
            alert("照片上傳失敗：" + uploadError.message);
            btn.disabled = false; btn.innerText = "送出歸還通知";
            return;
        }

        const { data: publicUrlData } = db.storage
            .from('return_photos')
            .getPublicUrl(fileName);

        const { error: dbError } = await db.from('return_records').insert([{
            return_date: date,
            leader_name: name,
            leader_phone: phone,
            photo_url: publicUrlData.publicUrl,
            notes: document.getElementById("returnNotes").value || "設備皆正常歸還"
        }]);

        if (dbError) { alert("資料寫入失敗：" + dbError.message); } 
        else {
            alert("已成功發送歸還通知並上傳照片！");
            document.getElementById("returnForm").reset();
            showSection('homeMenu');
        }
        btn.disabled = false; btn.innerText = "送出歸還通知";
    }

    let clickCount = 0;
    let clickTimer = null;

    function secretAdminTrigger() {
        clickCount++;
        
        if (clickCount >= 5) {
            checkAdminAccess();
            clickCount = 0; 
        }

        clearTimeout(clickTimer);
        clickTimer = setTimeout(() => {
            clickCount = 0;
        }, 2000);
    }
</script>
</body>
</html>
